project:
  type: book
  output-dir: _book

book:
  title: "Drawing the REO charts in Python"
  subtitle: "A chart-by-chart guide to the matplotlib scripts"
  author: "Bas Bakker"
  repo-url: https://github.com/BasBBakkerIMF/OpenAI-API-convert-charts
  repo-subdir: python_tutorial
  repo-actions: [source]
  search: true
  chapters:
    - index.qmd
    - chart-style.qmd
    - techniques.qmd
    - part: "The charts"
      chapters:
        - charts/fig-1-1.qmd
        - charts/fig-1-1-1.qmd
        - charts/fig-1-1-2.qmd
        - charts/fig-1-2.qmd
        - charts/fig-1-2-1.qmd
        - charts/fig-1-2-2.qmd
        - charts/fig-1-2-3.qmd
        - charts/fig-1-3-1.qmd
        - charts/fig-2-1.qmd
        - charts/fig-2-2.qmd
        - charts/fig-2-3.qmd
        - charts/fig-2-4.qmd
        - charts/fig-3-1.qmd
        - charts/fig-3-2.qmd
        - charts/fig-3-3.qmd
        - charts/fig-3-4.qmd
        - charts/fig-4-0.qmd
        - charts/fig-5-1.qmd
        - charts/fig-5-2.qmd
        - charts/fig-6-1.qmd
        - charts/fig-6-2.qmd
        - charts/fig-7-1.qmd
        - charts/fig-7-2.qmd
        - charts/fig-8-0.qmd
        - charts/fig-9-1.qmd
        - charts/fig-9-2.qmd
        - charts/fig-10-1.qmd
        - charts/fig-10-2.qmd
        - charts/fig-11-1.qmd
        - charts/fig-11-2.qmd
        - charts/fig-12-1.qmd
        - charts/fig-13-0.qmd
        - charts/fig-14-1.qmd
        - charts/fig-14-2.qmd
        - charts/fig-15-1.qmd
        - charts/fig-15-2.qmd
        - charts/fig-16-1.qmd
        - charts/fig-16-2.qmd
  appendices:
    - run-all.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    highlight-style: github
    fig-align: center
